$mainMod = SUPER
$terminal = ghostty
$fileManager = dolphin
$browser = firefox
$scriptsDir = $HOME/.config/hypr/scripts
$configs = $HOME/.config/hypr/config

bind = $mainMod, RETURN, exec, uwsm app -- $terminal
bind = $mainMod, E, exec, uwsm app -- $fileManager
bind = $mainMod, L, exec, pkill rofi || uwsm app -- ~/.config/hypr/scripts/Rofi-launcher.sh
bind = $mainMod, B, exec, uwsm app -- $browser
bind = $mainMod, W, exec, pkill -SIGUSR1 waybar # toggle waybar
bind = $mainMod SHIFT, W, exec, killall -SIGUSR2 waybar
bind = $mainMod, P, exec, $HOME/.config/rofi/powermenu/type-5/powermenu.sh # power menu
bind = , PRINT, exec, ~/.config/hypr/scripts/screenshot.sh s
bind = SHIFT, PRINT, exec, ~/.config/hypr/scripts/screenshot.sh p
# bind = $mainMod, L, exec, hyprlock

# WINDOW MANAGING
bind = $mainMod, Q, exec, ~/.config/hypr/scripts/dontkillsteam.sh # closes focused window
bind = $mainMod SHIFT, Q, exec, $scriptsDir/killactivewindow.sh
bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, F, toggleFloating
bind = $mainMod ALT, F, exec, hyprctl dispatch workspaceopt allfloat
bind = $mainMod, D, pseudo # dwindle
bind = $mainMod, S, togglesplit, # dwindle

bind = $mainMod, G, togglegroup
bind = $mainMod SHIFT, G, changegroupactive # switches to the next window in a group.

bind = $mainMod, left, movefocus, l # Move focus left
bind = $mainMod, right, movefocus, r # Move focus right
bind = $mainMod, up, movefocus, u # Move focus up
bind = $mainMod, down, movefocus, d # Move focus down

binde = $mainMod SHIFT, left, resizeactive,-10 0
binde = $mainMod SHIFT, right, resizeactive,10 0
binde = $mainMod SHIFT, up, resizeactive, 0 -10
binde = $mainMod SHIFT, down, resizeactive, 0 10

binde = $mainMod SHIFT ALT, left, resizeactive,-50 0
binde = $mainMod SHIFT ALT, right, resizeactive,50 0
binde = $mainMod SHIFT ALT, up, resizeactive, 0 -50
binde = $mainMod SHIFT ALT, down, resizeactive, 0 50

bind = $mainMod CTRL, left, movewindow, l
bind = $mainMod CTRL, right, movewindow, r
bind = $mainMod CTRL, up, movewindow, u
bind = $mainMod CTRL, down, movewindow, d

bindm = $mainMod, mouse:272, movewindow # Move window
bindm = $mainMod, mouse:273, resizewindow # Resize window

bind = ALT, tab, cyclenext
bind = ALT, tab, bringactivetotop # if floating bring to top

# MULTIMEDIA
bind = , XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/volumecontrol.sh -o i 
bind = , XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/volumecontrol.sh -o d
bind = , XF86AudioMute, exec, ~/.config/hypr/scripts/volumecontrol.sh -o m 
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindel = ,XF86MonBrightnessUp, exec, uwsm app -- $scriptsDir/brightness.sh --inc # increase brightness
bindel = ,XF86MonBrightnessDown, exec, uwsm app -- $scriptsDir/brightness.sh --dec # decrease brightness

bind = , XF86WLAN, exec, nmcli radio wifi toggle

bindl = , xf86AudioPlayPause, exec, uwsm app -- $scriptsDir/mediactrl.sh --pause
bindl = , xf86AudioPause, exec, uwsm app -- $scriptsDir/mediactrl.sh --pause
bindl = , xf86AudioPlay, exec, uwsm app -- $scriptsDir/mediactrl.sh --pause
bindl = , xf86AudioNext, exec, uwsm app -- $scriptsDir/mediactrl.sh --nxt
bindl = , xf86AudioPrev, exec, uwsm app -- $scriptsDir/mediactrl.sh --prv
bindl = , xf86AudioStop, exec, uwsm app -- $scriptsDir/mediactrl.sh --stop

# WORKSPACE
# The following mappings use the key codes to better support various keyboard layouts
# 1 is code:10, 2 is code 11, etc
# Switch workspaces with mainMod + [0-9] 
bind = $mainMod, code:10, workspace, 1
bind = $mainMod, code:11, workspace, 2
bind = $mainMod, code:12, workspace, 3
bind = $mainMod, code:13, workspace, 4
bind = $mainMod, code:14, workspace, 5
bind = $mainMod, code:15, workspace, 6
bind = $mainMod, code:16, workspace, 7
bind = $mainMod, code:17, workspace, 8
bind = $mainMod, code:18, workspace, 9
bind = $mainMod, code:19, workspace, 10

# Move active window and follow to workspace mainMod + SHIFT [0-9]
bind = $mainMod SHIFT, code:10, movetoworkspace, 1
bind = $mainMod SHIFT, code:11, movetoworkspace, 2
bind = $mainMod SHIFT, code:12, movetoworkspace, 3
bind = $mainMod SHIFT, code:13, movetoworkspace, 4
bind = $mainMod SHIFT, code:14, movetoworkspace, 5
bind = $mainMod SHIFT, code:15, movetoworkspace, 6
bind = $mainMod SHIFT, code:16, movetoworkspace, 7
bind = $mainMod SHIFT, code:17, movetoworkspace, 8
bind = $mainMod SHIFT, code:18, movetoworkspace, 9
bind = $mainMod SHIFT, code:19, movetoworkspace, 10
bind = $mainMod SHIFT, bracketleft, movetoworkspace, -1 # brackets [ or ]
bind = $mainMod SHIFT, bracketright, movetoworkspace, +1

# Move active window to a workspace silently mainMod + CTRL [0-9]
bind = $mainMod CTRL, code:10, movetoworkspacesilent, 1
bind = $mainMod CTRL, code:11, movetoworkspacesilent, 2
bind = $mainMod CTRL, code:12, movetoworkspacesilent, 3
bind = $mainMod CTRL, code:13, movetoworkspacesilent, 4
bind = $mainMod CTRL, code:14, movetoworkspacesilent, 5
bind = $mainMod CTRL, code:15, movetoworkspacesilent, 6
bind = $mainMod CTRL, code:16, movetoworkspacesilent, 7
bind = $mainMod CTRL, code:17, movetoworkspacesilent, 8
bind = $mainMod CTRL, code:18, movetoworkspacesilent, 9
bind = $mainMod CTRL, code:19, movetoworkspacesilent, 10
bind = $mainMod CTRL, bracketleft, movetoworkspacesilent, -1 # brackets [ or ]
bind = $mainMod CTRL, bracketright, movetoworkspacesilent, +1

bind = $mainMod, mouse_down, workspace, e+1 # Scroll workspaces 
bind = $mainMod, mouse_up, workspace, e-1 # Scroll workspaces

# SPECIAL WORKSPACE
bind = $mainMod SHIFT, U, movetoworkspace, special
bind = $mainMod, U, togglespecialworkspace