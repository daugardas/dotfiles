$mainMod = SUPER
$terminal = ghostty
$fileManager = dolphin
$browser = firefox
$scriptsDir = $HOME/.config/hypr/scripts
$configs = $HOME/.config/hypr/config

bind = $mainMod, RETURN, exec, uwsm app -- $terminal
bind = $mainMod, E, exec, uwsm app -- $fileManager
bind = $mainMod, L, exec, pkill rofi || uwsm app -- ~/.config/hypr/scripts/Rofi-launcher.sh
bind = $mainMod, B, exec, uwsm app -- $browser
bind = $mainMod, W, exec, pkill -SIGUSR1 waybar # toggle waybar
bind = $mainMod SHIFT, W, exec, killall -SIGUSR2 waybar
bind = $mainMod, P, exec, uwsm app -- wlogout -b 5 # power menu
bind = , PRINT, exec, ~/.config/hypr/screenshot.sh s
bind = SHIFT, PRINT, exec, ~/.config/hypr/screenshot.sh p
# bind = $mainMod, L, exec, hyprlock

# WINDOW MANAGING
bind = $mainMod, Q, exec, ~/.config/hypr/scripts/dontkillsteam.sh # closes focused window
bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, F, toggleFloating
bind = $mainMod, D, pseudo # dwindle
bind = $mainMod, S, togglesplit, # dwindle

bind = $mainMod, G, togglegroup
bind = $mainMod SHIFT, G, changegroupactive # switches to the next window in a group.

bind = $mainMod, left, movefocus, l # Move focus left
bind = $mainMod, right, movefocus, r # Move focus right
bind = $mainMod, up, movefocus, u # Move focus up
bind = $mainMod, down, movefocus, d # Move focus down

binde = $mainMod SHIFT, left, resizeactive,-10 0
binde = $mainMod SHIFT, right, resizeactive,10 0
binde = $mainMod SHIFT, up, resizeactive, 0 -10
binde = $mainMod SHIFT, down, resizeactive, 0 10

binde = $mainMod SHIFT ALT, left, resizeactive,-50 0
binde = $mainMod SHIFT ALT, right, resizeactive,50 0
binde = $mainMod SHIFT ALT, up, resizeactive, 0 -50
binde = $mainMod SHIFT ALT, down, resizeactive, 0 50

bind = $mainMod CTRL, left, movewindow, l
bind = $mainMod CTRL, right, movewindow, r
bind = $mainMod CTRL, up, movewindow, u
bind = $mainMod CTRL, down, movewindow, d

bindm = $mainMod, mouse:272, movewindow # Move window
bindm = $mainMod, mouse:273, resizewindow # Resize window

# MULTIMEDIA
bind = , XF86AudioRaiseVolume, exec, ~/.config/hypr/volumecontrol.sh -o i 
bind = , XF86AudioLowerVolume, exec, ~/.config/hypr/volumecontrol.sh -o d
bind = , XF86MonBrightnessUp, exec, brightnessctl set 10%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10%-
bind = , XF86AudioMute, exec, ~/.config/hypr/volumecontrol.sh -o m 
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = , XF86WLAN, exec, nmcli radio wifi toggle

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# WORKSPACE
bind = $mainMod, 1, workspace, 1 # Switch to workspace 1
bind = $mainMod, 2, workspace, 2 # Switch to workspace 2
bind = $mainMod, 3, workspace, 3 # Switch to workspace 3
bind = $mainMod, 4, workspace, 4 # Switch to workspace 4
bind = $mainMod, 5, workspace, 5 # Switch to workspace 5
bind = $mainMod, 6, workspace, 6 # Switch to workspace 6
bind = $mainMod, 7, workspace, 7 # Switch to workspace 7
bind = $mainMod, 8, workspace, 8 # Switch to workspace 8
bind = $mainMod, 9, workspace, 9 # Switch to workspace 9
bind = $mainMod, 0, workspace, 10 # Switch to workspace 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1 #  Move window to workspace 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2 #  Move window to workspace 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3 #  Move window to workspace 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4 #  Move window to workspace 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5 #  Move window to workspace 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6 #  Move window to workspace 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7 #  Move window to workspace 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8 #  Move window to workspace 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9 #  Move window to workspace 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10 #  Move window to workspace 10

bind = $mainMod, mouse_down, workspace, e+1 # Scroll workspaces 
bind = $mainMod, mouse_up, workspace, e-1 # Scroll workspaces

# SPECIAL WORKSPACE
bind = $mainMod SHIFT, U, movetoworkspace, special
bind = $mainMod, U, togglespecialworkspace
