# See https://wiki.hyprland.org/Configuring/Variables/ for more
decoration {
    rounding = 5

    blur {
        enabled = true
        size = 2
        passes = 2
        new_optimizations = true
        ignore_opacity = on
        xray = false
    }
    shadow {
        enabled = false
        range = 3
        render_power = 1
        color = rgba(1a1a1aee)
    }
}
