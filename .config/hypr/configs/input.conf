input {
  kb_layout = us, lt
  kb_variant =
  kb_model =
  kb_options = grp:win_space_toggle
  kb_rules =
  repeat_rate = 50
  repeat_delay = 300
  
  sensitivity = 0 #mouse sensitivity
  numlock_by_default = true
  left_handed = false
  follow_mouse = true
  float_switch_override_focus = false

  touchpad {
    disable_while_typing = false
    natural_scroll = true 
    clickfinger_behavior = false
    middle_button_emulation = true
    tap-to-click = true
    drag_lock = false
          }
  
    # touchdevice is a touchscreen
	touchdevice {
		enabled = false
	}
}