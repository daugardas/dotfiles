# avoid idle for fullscreen apps
windowrulev2 = idleinhibit fullscreen, class:^(*)$
windowrulev2 = idleinhibit fullscreen, title:^(*)$
windowrulev2 = idleinhibit fullscreen, fullscreen:1

windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# Picture in picture
windowrulev2 = move 72% 7%, title:^(Picture-in-Picture)$
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = keepaspectratio, title:^(Picture-in-Picture)$
windowrule = opacity 1 1, focus:1
windowrule = opacity 0.8 0.8, focus:0
windowrule = opacity 1 1 override, class:^(firefox)$
windowrule = noblur, class:firefox

windowrulev2 = float,class:^(qt5ct)$
windowrulev2 = float,class:^(nwg-look)$
windowrulev2 = float,class:^(org.kde.ark)$
windowrulev2 = float,class:^(net.davidotek.pupgui2)$ #ProtonUp-Qt
windowrulev2 = float,class:^(io.gitlab.theevilskeleton.Upscaler)$ #Upscaler-Gtk
windowrulev2 = float,class:^(pavucontrol)$
windowrulev2 = float,class:^(blueman-manager)$
windowrulev2 = float,class:^(nm-applet)$
windowrulev2 = float,class:^(nm-connection-editor)$
windowrulev2 = float,class:^(org.kde.polkit-kde-authentication-agent-1)$

windowrule = workspace 9 silent, title:^(.*equibop.*)$
windowrule = workspace 9 silent, class:^(steam)$
windowrule = workspace 9 silent, class:^(heroic)$

windowrule = workspace 2, class:^(steam_app_.*|steam_proton|streaming_client|gamescope|factorio|<any-other-native-games>)$
# windowrule = fullscreen, class:^(steam_app_.*|steam_proton|streaming_client|gamescope|factorio|<any-other-native-games>)$
windowrule = idleinhibit always, class:^(steam_app_.*|steam_proton|streaming_client|gamescope|factorio|<any-other-native-games>)$